[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Android targets are linked with the NDK clang. The NDK bin dir must be on PATH.
[target.aarch64-linux-android]
linker = "aarch64-linux-android26-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android26-clang"

[alias]
prof = "run --release --package sonora --features profiler"
prober = "run --package music --example lyrics-prober --"
