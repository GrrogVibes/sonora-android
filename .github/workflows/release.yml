name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # nightly.yml still calls this workflow as a reusable one with these inputs.
  # The Android-only build ignores them, but declaring them keeps that caller
  # valid instead of failing with "workflow does not define workflow_call".
  workflow_call:
    inputs:
      nightly:
        type: string
        required: false
      reuse:
        type: string
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Android APK (arm64-v8a)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # JDK 17 — the same version the build script expects.
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu-22.04 image already ships the Android SDK at $ANDROID_HOME.
      # Do NOT use android-actions/setup-android@v3 here: it tries to install the
      # removed `tools` package and dies with "Failed to find package 'tools'"
      # (sdkmanager exit 1), which fails the whole release before it builds.
      - name: Install Android build tools and NDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # Rust with the Android target and cargo-ndk.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # rust-toolchain.toml pins 1.98.1, which overrides the `stable` toolchain the
      # action installed. cargo therefore runs on 1.98.1, so add the Android std to
      # that toolchain too or the build fails with "can't find crate for `core`".
      - name: Android std for the pinned toolchain
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Host build deps for the Rust side. Ubuntu 22.04 does not ship llvm-19 in its
      # default repos (it would make apt-get fail and the whole release fail); its
      # libclang-dev is enough for bindgen 0.72. Point LIBCLANG_PATH at that version.
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mold cmake g++ nasm perl pkg-config libclang-dev llvm-dev \
            libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libgl1-mesa-dev curl unzip zip
          CLANG_MAJOR=$(ls /usr/lib | sed -n 's/^llvm-\([0-9]*\)$/\1/p' | sort -n | tail -1)
          echo "LIBCLANG_PATH=/usr/lib/llvm-$CLANG_MAJOR/lib" >> "$GITHUB_ENV"

      # Build the APK. The script sets CARGO_BUILD_JOBS and signs with the debug
      # keystore it generates on the runner if it is not there yet.
      - name: build the APK
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -target aarch64-linux-android26"
          android/build-apk.sh

      # Make sure the APK carries the right version and is non-empty.
      - name: verify the APK
        run: |
          set -euo pipefail
          apk=$(ls android/SonoraDroid*.apk)
          test -s "$apk"
          # Read the expected version from the build file so this check cannot go
          # stale on the next bump (it previously hard-coded 0.50.3.2).
          expected=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          echo "$apk" | grep -q "$expected"
          echo "Built $apk ($(du -h "$apk" | cut -f1))"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/SonoraDroid*.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist

      - name: release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > notes.md
          printf '\n**This project is 110%% vibe-coded via [Hermes Agent](https://hermes-agent.nousresearch.com). It works on my phone; I have no idea what happens on yours — use it at your own risk.**\n' >> notes.md
          printf '\nThe APK is debug-signed (no release keystore) and arm64-v8a only. See the README for build instructions, licences and known gaps.\n' >> notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
